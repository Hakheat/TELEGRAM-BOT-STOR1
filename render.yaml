services:
  - type: web
    name: telegram-bot-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: KEY_ENCRYPTION_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: KHQR_MERCHANT_NAME
        value: "DIGITAL STORE KH"
      - key: KHQR_MERCHANT_CITY
        value: "PHNOM PENH"
      - key: KHQR_ACCOUNT_NUMBER
        sync: false
      - key: KHQR_SECRET
        generateValue: true
